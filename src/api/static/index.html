<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IT Helpdesk Co-Pilot</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --border: #e4e8f1;
    --text: #1a1d29;
    --text-muted: #6b7280;
    --brand: #4f46e5;
    --brand-dark: #4338ca;
    --brand-light: #eef2ff;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --purple: #7c3aed;
    --purple-bg: #ede9fe;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 4px 12px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.04);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 4px 8px; }
  .brand-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--brand), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--text-muted); }

  .new-ticket-btn {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: none;
    background: var(--brand); color: white; font-weight: 600; font-size: 13.5px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s ease;
  }
  .new-ticket-btn:hover { background: var(--brand-dark); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card {
    background: var(--brand-light); border-radius: 10px; padding: 10px 12px;
  }
  .stat-value { font-size: 19px; font-weight: 700; color: var(--brand-dark); }
  .stat-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }

  .sidebar-section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-muted); margin: 4px 2px 0;
  }
  .ticket-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .ticket-item {
    padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent;
    transition: all .12s ease;
  }
  .ticket-item:hover { background: var(--bg); }
  .ticket-item.active { background: var(--brand-light); border-color: #c7d2fe; }
  .ticket-item-subject { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticket-item-meta { display: flex; gap: 4px; flex-wrap: wrap; }
  .empty-sidebar { font-size: 12px; color: var(--text-muted); padding: 10px 2px; }

  /* ---------- Main ---------- */
  .main { padding: 32px 40px; max-width: 900px; width: 100%; margin: 0 auto; }
  .page-header { margin-bottom: 24px; }
  .page-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .page-subtitle { font-size: 13.5px; color: var(--text-muted); margin: 0; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .field-label { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; display: block; color: var(--text); }
  input[type="text"], textarea {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 14px; color: var(--text); background: var(--bg);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); background: white;
  }
  textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .field { margin-bottom: 16px; }

  .btn {
    padding: 11px 22px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all .15s ease;
  }
  .btn-primary { background: var(--brand); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--brand-dark); transform: translateY(-1px); }
  .btn-primary:disabled { background: #c7c9d9; cursor: default; }
  .btn-accept { background: var(--green); color: white; }
  .btn-accept:hover { background: #15803d; }
  .btn-reject { background: var(--red-bg); color: var(--red); }
  .btn-reject:hover { background: #fecaca; }

  .spinner {
    width: 15px; height: 15px; border: 2.5px solid rgba(255,255,255,.4);
    border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-cat { background: var(--purple-bg); color: var(--purple); }
  .pill-low { background: var(--green-bg); color: var(--green); }
  .pill-medium { background: var(--amber-bg); color: var(--amber); }
  .pill-high, .pill-critical { background: var(--red-bg); color: var(--red); }

  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .confidence-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .confidence-label { font-size: 12px; color: var(--text-muted); width: 110px; flex-shrink: 0; }
  .confidence-track { flex: 1; height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .confidence-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), #8b5cf6); width: 0; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .confidence-pct { font-size: 12px; font-weight: 600; width: 36px; text-align: right; color: var(--text-muted); }

  .model-tag { font-size: 10.5px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 6px; margin-left: 6px; }

  .suggestion-card { border-top: 1px dashed var(--border); margin-top: 18px; padding-top: 18px; }
  .suggestion-title { font-size: 14px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .suggestion-meta { font-size: 11.5px; color: var(--text-muted); margin-bottom: 14px; }
  .steps-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .step-item { display: flex; gap: 12px; align-items: flex-start; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--brand-light); color: var(--brand-dark);
    font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .step-text { font-size: 13.5px; line-height: 1.55; }
  .suggestion-plain { font-size: 13.5px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }

  .skeleton { background: linear-gradient(90deg, var(--border) 25%, #f0f1f6 37%, var(--border) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 8px; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .skeleton-line { height: 13px; margin-bottom: 8px; }

  .feedback-row { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .feedback-done { font-size: 12.5px; color: var(--green); font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
  .empty-state-icon { font-size: 34px; margin-bottom: 10px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--text); color: white;
    padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px); transition: all .25s ease; pointer-events: none;
    display: flex; align-items: center; gap: 8px; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .error-banner {
    background: var(--red-bg); color: var(--red); padding: 12px 16px; border-radius: 10px;
    font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">IT</div>
      <div>
        <div class="brand-name">Helpdesk Co-Pilot</div>
        <div class="brand-sub">GenAI triage &amp; resolution</div>
      </div>
    </div>

    <button class="new-ticket-btn" onclick="resetForm()">
      <span>+</span> New ticket
    </button>

    <div>
      <div class="sidebar-section-title">Overview</div>
      <div class="stat-grid" id="statGrid" style="margin-top:8px">
        <div class="stat-card"><div class="stat-value" id="statTotal">–</div><div class="stat-label">Tickets</div></div>
        <div class="stat-card"><div class="stat-value" id="statAccept">–</div><div class="stat-label">Accept rate</div></div>
      </div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="sidebar-section-title">Recent tickets</div>
      <div class="ticket-list" id="ticketList" style="margin-top:8px;">
        <div class="empty-sidebar">No tickets yet — submit one to get started.</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title">New support ticket</h1>
      <p class="page-subtitle">DistilBERT classifies the ticket, then a RAG pipeline drafts a resolution playbook.</p>
    </div>

    <div id="errorBanner"></div>

    <div class="card" id="formCard">
      <div class="field">
        <label class="field-label">Subject</label>
        <input type="text" id="subject" placeholder="e.g. VPN keeps disconnecting" />
      </div>
      <div class="field">
        <label class="field-label">Description</label>
        <textarea id="description" placeholder="Describe the issue in as much detail as possible..."></textarea>
      </div>
      <button class="btn btn-primary" id="submitBtn" onclick="submitTicket()">
        <span id="submitBtnText">Analyze ticket</span>
      </button>
    </div>

    <div id="resultArea"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
let currentTicketId = null;

const PRIORITY_CLASS = { low: 'pill-low', medium: 'pill-medium', high: 'pill-high', critical: 'pill-critical' };

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

function showError(msg) {
  document.getElementById('errorBanner').innerHTML = msg
    ? `<div class="error-banner">⚠ ${escapeHtml(msg)}</div>` : '';
}

function resetForm() {
  currentTicketId = null;
  document.getElementById('subject').value = '';
  document.getElementById('description').value = '';
  document.getElementById('resultArea').innerHTML = '';
  showError('');
  highlightActiveTicket(null);
}

function renderSteps(text) {
  // try to parse "1. ... 2. ..." style numbered output into a clean list
  const matches = [...text.matchAll(/(?:^|\s)(\d{1,2})[.)]\s+([^]*?)(?=(?:\s\d{1,2}[.)]\s)|$)/g)];
  if (matches.length >= 2) {
    const items = matches.map(m => `
      <li class="step-item">
        <div class="step-num">${m[1]}</div>
        <div class="step-text">${escapeHtml(m[2].trim())}</div>
      </li>`).join('');
    return `<ul class="steps-list">${items}</ul>`;
  }
  return `<div class="suggestion-plain">${escapeHtml(text)}</div>`;
}

async function submitTicket() {
  const subject = document.getElementById('subject').value;
  const description = document.getElementById('description').value;
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('submitBtnText');
  const resultArea = document.getElementById('resultArea');

  showError('');
  if (!description.trim()) { showError('Please enter a ticket description.'); return; }

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Classifying…';

  try {
    const predRes = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subject, description }),
    });
    if (!predRes.ok) throw new Error((await predRes.json()).detail || 'Prediction failed');
    const pred = await predRes.json();
    currentTicketId = pred.ticket_id;

    const prioClass = PRIORITY_CLASS[pred.priority] || 'pill-medium';

    resultArea.innerHTML = `
      <div class="card">
        <div class="result-header">
          <div class="pill-row">
            <span class="pill pill-cat"><span class="pill-dot"></span>${escapeHtml(pred.category)}</span>
            <span class="pill ${prioClass}"><span class="pill-dot"></span>${escapeHtml(pred.priority)} priority</span>
          </div>
        </div>
        <div class="confidence-row">
          <div class="confidence-label">Category</div>
          <div class="confidence-track"><div class="confidence-fill" id="catFill"></div></div>
          <div class="confidence-pct">${Math.round(pred.category_confidence*100)}%</div>
          <span class="model-tag">${pred.model_used.category}</span>
        </div>
        <div class="confidence-row">
          <div class="confidence-label">Priority</div>
          <div class="confidence-track"><div class="confidence-fill" id="prioFill"></div></div>
          <div class="confidence-pct">${Math.round(pred.priority_confidence*100)}%</div>
          <span class="model-tag">${pred.model_used.priority}</span>
        </div>

        <div class="suggestion-card" id="suggestionCard">
          <div class="suggestion-title">💡 Suggested resolution playbook</div>
          <div class="skeleton skeleton-line" style="width:90%"></div>
          <div class="skeleton skeleton-line" style="width:75%"></div>
          <div class="skeleton skeleton-line" style="width:82%"></div>
        </div>
      </div>`;

    requestAnimationFrame(() => {
      document.getElementById('catFill').style.width = (pred.category_confidence*100) + '%';
      document.getElementById('prioFill').style.width = (pred.priority_confidence*100) + '%';
    });

    loadTickets();
    loadStats();

    const sugRes = await fetch(`/suggest-resolution?ticket_id=${pred.ticket_id}`, { method: 'POST' });
    if (!sugRes.ok) throw new Error((await sugRes.json()).detail || 'Resolution generation failed');
    const sug = await sugRes.json();

    document.getElementById('suggestionCard').innerHTML = `
      <div class="suggestion-title">💡 Suggested resolution playbook</div>
      <div class="suggestion-meta">backend: ${escapeHtml(sug.backend)} &middot; ${sug.retrieved_count} similar past tickets retrieved</div>
      ${renderSteps(sug.suggestion)}
      <div class="feedback-row" id="feedbackRow">
        <button class="btn btn-accept" onclick="sendFeedback('yes')">✓ Accept</button>
        <button class="btn btn-reject" onclick="sendFeedback('no')">✕ Reject</button>
      </div>`;
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Analyze ticket';
  }
}

async function sendFeedback(accepted) {
  try {
    const res = await fetch('/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticket_id: currentTicketId, agent_accepted: accepted }),
    });
    if (!res.ok) throw new Error('Could not log feedback');
    document.getElementById('feedbackRow').innerHTML =
      `<span class="feedback-done">✓ Feedback logged — thank you!</span>`;
    showToast(accepted === 'yes' ? 'Marked as accepted' : 'Marked as rejected');
    loadStats();
  } catch (err) {
    showToast(err.message);
  }
}

function highlightActiveTicket(id) {
  document.querySelectorAll('.ticket-item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.id) === id);
  });
}

async function loadTickets() {
  try {
    const res = await fetch('/tickets?limit=20');
    if (!res.ok) return;
    const tickets = await res.json();
    const listEl = document.getElementById('ticketList');
    if (!tickets.length) {
      listEl.innerHTML = '<div class="empty-sidebar">No tickets yet — submit one to get started.</div>';
      return;
    }
    listEl.innerHTML = tickets.map(t => {
      const prioClass = PRIORITY_CLASS[t.predicted_priority] || 'pill-medium';
      return `
        <div class="ticket-item" data-id="${t.id}" onclick="openTicket(${t.id})">
          <div class="ticket-item-subject">${escapeHtml(t.subject || t.description.slice(0,40))}</div>
          <div class="ticket-item-meta">
            ${t.predicted_category ? `<span class="pill pill-cat" style="padding:2px 8px;font-size:10.5px;">${escapeHtml(t.predicted_category)}</span>` : ''}
            ${t.predicted_priority ? `<span class="pill ${prioClass}" style="padding:2px 8px;font-size:10.5px;">${escapeHtml(t.predicted_priority)}</span>` : ''}
          </div>
        </div>`;
    }).join('');
    highlightActiveTicket(currentTicketId);
  } catch (e) { /* non-fatal */ }
}

async function loadStats() {
  try {
    const res = await fetch('/stats');
    if (!res.ok) return;
    const s = await res.json();
    document.getElementById('statTotal').textContent = s.total_tickets;
    document.getElementById('statAccept').textContent =
      s.feedback_accept_rate === null ? '–' : Math.round(s.feedback_accept_rate*100) + '%';
  } catch (e) { /* non-fatal */ }
}

async function openTicket(id) {
  try {
    const res = await fetch(`/tickets/${id}`);
    if (!res.ok) return;
    const t = await res.json();
    currentTicketId = t.id;
    document.getElementById('subject').value = t.subject || '';
    document.getElementById('description').value = t.description || '';
    showError('');
    highlightActiveTicket(id);

    const resultArea = document.getElementById('resultArea');
    const prioClass = PRIORITY_CLASS[t.predicted_priority] || 'pill-medium';
    resultArea.innerHTML = `
      <div class="card">
        <div class="result-header">
          <div class="pill-row">
            <span class="pill pill-cat"><span class="pill-dot"></span>${escapeHtml(t.predicted_category || '—')}</span>
            <span class="pill ${prioClass}"><span class="pill-dot"></span>${escapeHtml(t.predicted_priority || '—')} priority</span>
          </div>
        </div>
        <div class="confidence-row">
          <div class="confidence-label">Category</div>
          <div class="confidence-track"><div class="confidence-fill" style="width:${Math.round((t.category_confidence||0)*100)}%"></div></div>
          <div class="confidence-pct">${Math.round((t.category_confidence||0)*100)}%</div>
        </div>
        <div class="confidence-row">
          <div class="confidence-label">Priority</div>
          <div class="confidence-track"><div class="confidence-fill" style="width:${Math.round((t.priority_confidence||0)*100)}%"></div></div>
          <div class="confidence-pct">${Math.round((t.priority_confidence||0)*100)}%</div>
        </div>
        ${t.suggested_resolution ? `
          <div class="suggestion-card">
            <div class="suggestion-title">💡 Suggested resolution playbook</div>
            <div class="suggestion-meta">backend: ${escapeHtml(t.rag_backend || '—')}</div>
            ${renderSteps(t.suggested_resolution)}
          </div>` : ''}
      </div>`;
  } catch (e) { showToast('Could not load ticket'); }
}

loadTickets();
loadStats();
</script>
</body>
</html>
